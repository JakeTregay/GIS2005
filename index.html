<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>ArcGIS Maps SDK for JavaScript Tutorials: Display a map</title>
    <<link rel="stylesheet" href="style.css">
    <style>
      html,
      body {
        height: 100%;
        margin: 0;
      }

      #banner {
    position: relative;
    height: 150px;
    width: 100%;
    overflow: hidden;
}

#banner img {
  height: 150px;
    width: auto;
    object-fit: cover;
}

.banner-text {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    color: white;
    font-size: 20px;
    font-weight: bold;
}


      arcgis-map {
        display:block;
        margin: 0 auto;
        overflow-y: auto;
        overflow-x: auto;
      }
      .description {
        width: 800px;
        margin: 20px auto;
        font-family: Arial, sans-serif;
      }
    </style>

    <script type="module" src="https://js.arcgis.com/5.1/"></script>
  </head>

  <body>

      <div class="description">
      
    </div>

    
    <script type="module">
      const viewElement = document.querySelector("arcgis-map");

      const locString = window.location;
      console.log("locString=" + locString);
      const urlParams = new URLSearchParams(locString.search);
      let resort = urlParams.get("resort");
      console.log(resort);
      if (resort=="winterpark") {
        viewElement.goTo(
          // go to point with a custom animation duration
          { center: [-105.76, 39.89] },
          { duration: 5000 },
          );
      }
      if (resort=="snowmass") {
        viewElement.goTo(
          // go to point with a custom animation duration
          { center: [-106.9513, 39.1956] },
          { duration: 5000 },
          );
      }
viewElement.zoom = 13;

    </script>
    <div class="container">
    <div class="header">
        
        <img src="/GIS2005/images/banner.JPG" class="banner" alt="Local Map Banner">

         <span class="banner-text">Colorado Map</span>
    </div>
    <div class="content-body">
       
        <p>
        This map displays trail locations, playgrounds and surrounding terrain in Boulder Colorado.
      </p>
         <arcgis-map item-id="0aef785949ac4ee5bd16e029586de35f" 
                center="-105.280712, 40.013911" 
                zoom="10">
      <arcgis-zoom slot="top-left"></arcgis-zoom>
    </arcgis-map>
    </div>
    <div class="footer">
        <p>
        <strong>Layer Highlight:</strong>  
        The primary layer in this webmap shows the terrain around Boulder. These layers help
        visualize elevation, land cover, important playgrounds and trails to go have fun around.
      </p>
</div>
    </div>
  </body>

</html>
